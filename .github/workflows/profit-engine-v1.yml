name: Profit Engine v1 validation

on:
  workflow_dispatch:
  push:
    branches:
      - profit-engine-v1
    paths:
      - scripts/apply-profit-engine-v1.mjs
      - .github/workflows/profit-engine-v1.yml

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: profit-engine-v1
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply profit-engine-v1 source edits
        run: node scripts/apply-profit-engine-v1.mjs

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit validated source edits
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat: apply validated profit-engine v1 safeguards"
          git push origin HEAD:profit-engine-v1
