name: Revenue verification v3

on:
  workflow_dispatch:
  push:
    branches:
      - profit-engine-v3-revenue-verification
    paths:
      - .github/workflows/revenue-verification-v3.yml

permissions:
  contents: write

concurrency:
  group: revenue-verification-v3
  cancel-in-progress: true

jobs:
  harden-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profit-engine-v3-revenue-verification
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply trusted revenue verifier
        run: node scripts/apply-revenue-verification-v3.mjs
      - name: Regenerate protected-kernel manifest
        run: |
          node scripts/generate-kernel-manifest.mjs
          node scripts/check-kernel-manifest.mjs
      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Revenue verification regression tests
        run: pnpm vitest run src/__tests__/revenue-verification-v3.test.ts
      - name: Protected-kernel regression tests
        run: pnpm vitest run src/__tests__/governance/kernel.test.ts
      - name: Security regression suite
        run: pnpm run test:security
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
      - name: Full tests - fail closed
        timeout-minutes: 15
        run: timeout 840 pnpm test
      - name: Build
        run: pnpm build
      - name: Re-verify protected kernel after tests/build
        run: node scripts/check-kernel-manifest.mjs
      - name: Commit only after every gate is green
        run: |
          if git diff --name-only | grep '^.github/workflows/'; then
            echo "Generated source patch unexpectedly modified a workflow file."
            exit 1
          fi
          git add src kernel-manifest.json scripts/check-kernel-manifest.mjs scripts/generate-kernel-manifest.mjs
          git commit -m "feat(revenue): verify Base USDC before counting earned revenue"
      - name: Push validated source
        run: git push origin HEAD:profit-engine-v3-revenue-verification
