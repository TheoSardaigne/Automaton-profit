name: CI

on: [push, pull_request]

jobs:
  kernel-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify protected kernel manifest
        run: |
          if [ -f scripts/check-kernel-manifest.mjs ] && [ -f kernel-manifest.json ]; then
            node scripts/check-kernel-manifest.mjs
          else
            echo "::notice::Protected kernel is not installed on this transitional commit yet."
          fi

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Run full test suite
        timeout-minutes: 15
        run: timeout 840 pnpm test
      - name: Run security regression suite
        timeout-minutes: 10
        run: pnpm run test:security
      - run: pnpm build

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Fail on production high/critical vulnerabilities
        run: pnpm audit --prod --audit-level=high
