name: Protected kernel audit v2

on:
  workflow_dispatch:
  push:
    branches:
      - profit-engine-v2-kernel-audit
    paths:
      - .github/workflows/kernel-audit-v2.yml

permissions:
  contents: write

concurrency:
  group: protected-kernel-audit-v2
  cancel-in-progress: true

jobs:
  port-regenerate-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profit-engine-v2-kernel-audit
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Port upstream protected-kernel foundation (PR #418 B6)
        run: |
          git fetch https://github.com/kaydot20/automaton.git 568955614b9c017e481b10e62427fb3e425ca8d6
          set +e
          git cherry-pick 568955614b9c017e481b10e62427fb3e425ca8d6
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts: $CONFLICTS"
            if [ "$CONFLICTS" != "package.json" ]; then
              echo "Unexpected conflict set; fail closed."
              git cherry-pick --abort
              exit 1
            fi
            git checkout --ours package.json
            git add package.json
            git cherry-pick --continue
          fi
      - name: Adapt protected kernel to this fork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          kernel_files = [
              Path('src/governance/kernel.ts'),
              Path('scripts/generate-kernel-manifest.mjs'),
              Path('scripts/check-kernel-manifest.mjs'),
          ]
          old_entry = '  "src/net/policy.ts",'
          new_entry = '  "src/registry/discovery.ts",'
          for path in kernel_files:
              text = path.read_text()
              if text.count(old_entry) != 1:
                  raise SystemExit(f"Unexpected kernel network entry count in {path}: {text.count(old_entry)}")
              path.write_text(text.replace(old_entry, new_entry))

          test_path = Path('src/__tests__/governance/kernel.test.ts')
          test_text = test_path.read_text()
          if test_text.count('src/net/policy.ts') < 2:
              raise SystemExit('Expected upstream kernel tests to reference src/net/policy.ts at least twice')
          test_path.write_text(test_text.replace('src/net/policy.ts', 'src/registry/discovery.ts'))
          PY
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts ??= {};
          pkg.scripts['check:kernel-manifest'] = 'node scripts/check-kernel-manifest.mjs';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          git add src/governance/kernel.ts scripts/generate-kernel-manifest.mjs scripts/check-kernel-manifest.mjs src/__tests__/governance/kernel.test.ts package.json
          git commit -m "fix(governance): adapt protected kernel contract to profit fork"
      - name: Regenerate manifest for OUR hardened source
        run: |
          node scripts/generate-kernel-manifest.mjs
          git add kernel-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(governance): regenerate protected kernel manifest for profit engine"
          fi
      - name: Verify kernel manifest before dependency install
        run: node scripts/check-kernel-manifest.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Kernel security tests
        run: pnpm vitest run src/__tests__/governance/kernel.test.ts
      - name: Full tests - fail closed
        timeout-minutes: 15
        run: timeout 840 pnpm test
      - name: Build
        run: pnpm build
      - name: Re-verify manifest after build/test
        run: node scripts/check-kernel-manifest.mjs
      - name: Push only if every gate passed
        run: git push origin HEAD:profit-engine-v2-kernel-audit
